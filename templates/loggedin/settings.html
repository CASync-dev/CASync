{% extends "loggedin/layout.html" %} {% block content %}
<div class="max-w-2xl mx-auto p-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-8">Settings</h1>

  <section class="mb-8">
    <div class="flex">
      <h2 class="text-lg font-semibold text-gray-800 mb-1">Import iCal</h2>
      <button
        id="sync-button"
        class="hidden bg-blue-600 text-white ml-auto py-2 px-2 rounded-md text-sm hover:bg-blue-700"
        type="button"
        title="Sync Existing Calenders"
        onclick="syncCal()"
      >
        <i class="fa-solid fa-rotate"></i> Sync
      </button>
    </div>
    <form>
      <p class="text-sm text-gray-500 mb-3">
        Paste your iCal feed URL to import events.
      </p>

      <div class="flex">
        <input
          type="url"
          id="ical_url"
          placeholder="https://..."
          class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div class="flex ml-4">
          <el-dropdown class="inline-block">
            <button
              class="inline-flex w-full justify-center rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50"
            >
              Users
              <i class="py-1 pl-2 fas fa-chevron-down text-xs"></i>
            </button>

            <el-menu
              anchor="bottom end"
              popover
              class="rounded-md bg-white shadow-lg outline-1 outline-black/5 [--anchor-gap:--spacing(2)]"
            >
              <div id="dropdown-menu-1" class="py-1"></div>
            </el-menu>
            <!-- Options get inserted here -->
          </el-dropdown>
          <button
            type="button"
            onclick="importICal()"
            class="bg-blue-600 text-white px-4 ml-2 py-2 rounded-md text-sm hover:bg-blue-700 shadow-xs inset-ring-1 inset-ring-gray-300"
          >
            Import
          </button>
        </div>
      </div>
      <p id="ical-message" class="mt-2 text-sm hidden"></p>
    </form>
  </section>
</div>

{% endblock %} {% block scripts %}
<script>
  // TODO: This will get replaced with a user session deteciton system later
  // Jquery  for adding user options to the dropdown (replace with actual user data)
  function addUserOptions(user) {
    const a = document.createElement('a');
    a.href = '#';
    a.className =
      'block px-4 py-2 text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden';
    a.textContent = user.username;
    a.dataset.userId = user.id; // Store user id in data attribute for later use
    $('#dropdown-menu-1').append(a);
  }
  // Get Users
  async function getUsers() {
    const res = await fetch('/api/users');
    const users = await res.json();
    users.forEach(addUserOptions);
  }
  getUsers();

  let selectedUserId = null;

  // Function to show success or error messages after importing iCal
  function showMsg(text, ok) {
    $('#ical-message')
      .text(text)
      .removeClass('hidden text-red-600 text-green-600')
      .addClass(ok ? 'text-green-600' : 'text-red-600');
  }

  // On Selection Of User From Dropdown, set selectedUserId
  $(document).on('click', '#dropdown-menu-1 a', function () {
    // Set selected user ID based on clicked option
    selectedUserId = $(this).data('userId');
    // Update dropdown button text to show selected user
    $('#menu-button-1').html(
      $(this).text() + ' <i class="py-1 pl-2 fas fa-chevron-down text-xs"></i>',
    );
    checkForExistingCalendars(); // Check if the selected user has existing calendars to determine whether to show sync button
  });

  async function importICal() {
    // Get the iCal URL from the input field
    const url = $('#ical_url').val().trim();

    // Basic validation
    if (!selectedUserId) {
      showMsg('Please select a user to import the calendar for.', false);
      return;
    }
    if (!url) {
      showMsg('Please enter an iCal URL.', false);
      return;
    }
    // Send the URL and selected user ID to the server for processing
    const res = await fetch(`/api/import-ical/${selectedUserId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: url,
        userId: selectedUserId,
      }),
    });
    // Handle the response and show appropriate messages
    const data = await res.json();

    if (res.ok) {
      // Show success message with details if available
      if (data.created !== undefined && data.updated !== undefined) {
        showMsg(
          `Successfully imported ${data.created} new events and updated ${data.updated} existing events.`,
          true,
        );
      } else if (data.created !== undefined) {
        // For backward compatibility if only created count is returned
        showMsg(`Successfully imported ${data.created} new events.`, true);
      } else {
        // Generic success message if no details provided
        showMsg('iCal imported successfully.', true);
      }
    } else {
      // Show error message with details if available
      showMsg('Error: ' + (data.error || 'Unknown error'), false);
    }
  }

  function checkForExistingCalendars() {
    /*
    Check if a selected user has any calender in the system. If they do
    show the sync button with the number of existing calenders, 
    if not hide the sync button since there is nothing to sync with
    */
    if (!selectedUserId) {
      $('#sync-button').addClass('hidden');
      return;
    }
    // Check if the user has any calendars
    fetch(`/api/calendars/${selectedUserId}`)
      .then((res) => res.json())
      .then((calendars) => {
        if (calendars.length > 0) {
          $('#sync-button').removeClass('hidden');
          $('#sync-button').html(
            `<i class="fa-solid fa-rotate"></i> Sync (${calendars.length}) cals`,
          );
        } else {
          $('#sync-button').addClass('hidden');
        }
      });
  }

  async function syncCal() {
    if (!selectedUserId) {
      showMsg('Please select a user to sync the calendar for.', false);
      return;
    }
    const res = await fetch(`/api/sync-cal/${selectedUserId}`, {
      method: 'POST',
    });
    const data = await res.json();
    if (res.ok) {
      showMsg(
        `Successfully synced calendar. ${data.created} events created, ${data.updated} events updated.`,
        true,
      );
    } else {
      showMsg('Error: ' + (data.error || 'Unknown error'), false);
    }
  }
</script>

{% endblock %}
