{% extends "loggedin/layout.html" %}
{% block content %}
  <!-- Main dashboard layout: top header row and bottom two-column content -->
  <div class="container-loggedin flex flex-col">
    <!-- Top row: username/date on the left, live clock on the right -->
    <div class="flex flex-row justify-between">
      <!-- Top-left: day/date and username header -->
      <div class="p-8 space-y-4 mb-4">
        <h1 id="title_username" class="text-4xl font-normal text-gray-900">
          Hello, <span id = "username" class="text-blue-600"></span>!
        </h1>

        <h2 class="text-7xl text-black mt-10">
          <span id="day" class="text-blue-600"></span>,
          <span id="current-date"></span>
        </h2>
      </div>
      <!-- Top-right: live clock display -->
      <div class="border-5 rounded-2xl border-gray-300 h-full mx-4 mt-10">
        <h2 class="text-7xl p-10">
          <span id="time" class="text-blue-600"> 2:30</span>
          <span id="period" class="text-black">PM</span>
        </h2>
      </div>
    </div>


    <div  class="mt-6 space-y-3"></div>

    <!-- Bottom row: events panel on the left, friends panel on the right -->
    <div class="flex flex-row gap-4">
      <div class="p-4 flex-1">
        <!-- Left panel: next event and event list -->
        <div class="flex flex-col gap-4">
          <!-- Primary event card -->
          
          <div id="big-card" class="flex flex-col bg-slate-200 rounded-2xl p-6">
            
            
            <!-- big card content rendered from dash.js-->
              
          </div>

          <!-- Sub-events (slightly indented) -->
          <div id="dashboard-sub-events" class="flex flex-col gap-3 ml-8">
            

           
            </div>
          </div>
        </div>
      </div>
      <div class="p-4 flex-1 mt-3.5 mr-4 mb-4 bg-slate-200 rounded-2xl">
        <!-- Right panel: friends who are available now -->
        <h3 class="text-4xl text-dark space-y-4 mb-4">
          Friends available now:
        </h3>
        <div class="flex flex-col gap-3">
          <div class="flex items-center bg-red-500 rounded-2xl p-6 gap-4">
            <span class="text-xl font-medium flex-1">Itachi</span>
            <span class="text-lg text-gray-500 w-50 text-right shrink-0"
              >Online</span
            >
            <div class="flex"><!-- avatar --></div>
          </div>

          <div class="flex items-center bg-orange-500 rounded-2xl p-6 gap-4">
            <span class="text-xl font-medium flex-1">Pain</span>
            <span class="text-lg text-gray-500 w-50 text-right shrink-0"
              >Online</span
            >
            <div class="flex"><!-- avatar --></div>
          </div>

          <div class="flex items-center bg-green-500 rounded-2xl p-6 gap-4">
            <span class="text-xl font-medium flex-1">Obito</span>
            <span class="text-lg text-gray-500 w-50 text-right shrink-0"
              >Offline</span
            >
            <div class="flex"><!-- avatar --></div>
          </div>

          <div class="flex items-center bg-yellow-500 rounded-2xl p-6 gap-4">
            <span class="text-xl font-medium flex-1">Kisame</span>
            <span class="text-lg text-gray-500 w-50 text-right shrink-0"
              >Offline</span
            >
            <div class="flex"><!-- avatar --></div>
          </div>

          <div class="flex items-center bg-purple-500 rounded-2xl p-6 gap-4">
            <span class="text-xl font-medium flex-1">Diedara</span>
            <span class="text-lg text-gray-500 w-50 text-right shrink-0"
              >Offline</span
            >
            <div class="flex"><!-- avatar --></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="items-center text-center text-xl">
      <h3>That's all for today!</h3>
    </footer>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/dash.js') }}"></script>
{% endblock %}
