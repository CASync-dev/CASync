{% extends "loggedin/layout.html" %}
{% block content %}
  <!-- Main dashboard layout: top header row and bottom two-column content -->
  <div class="container-loggedin flex flex-col">
    <!-- Top row: username/date on the left, live clock on the right -->
    <div class="flex flex-col sm:flex-row justify-between gap-2 sm:gap-4">
      <!-- Top-left: day/date and username header -->
      <div class="p-4 sm:p-6 md:p-8 space-y-2 sm:space-y-4 mb-4">
        <h1 id="title_username" class="text-2xl sm:text-3xl md:text-4xl font-normal text-gray-600">
          Hello, <span  class="text-blue-600"> {{ current_user.username }}</span>!
        </h1>

        <h2 class="text-3xl sm:text-4xl md:text-5xl lg:text-7xl text-gray-600 mt-4 sm:mt-6 md:mt-10">
          <span id="day" class="text-blue-600"></span>,
          <span id="current-date"></span>
        </h2>
      </div>
      <!-- Top-right: live clock display -->
      <div class="flex items-center justify-center border-5 rounded-2xl border-gray-300 mx-2 sm:mx-4 my-2 sm:my-8">
        <h2 class="text-3xl sm:text-4xl md:text-5xl lg:text-7xl p-4 sm:p-6 md:p-8 lg:p-10 text-center">
          <span id="time" class="text-blue-600"> 2:30</span>
          <span id="period" class="text-gray-600">PM</span>
        </h2>
      </div>
    </div>

    <!-- Bottom row: events panel on the left, friends panel on the right -->
    <div class="mt-1 sm:mt-2 flex flex-col gap-4 lg:flex-row">
      <div class="flex-1 min-w-0 p-4">
        <!-- Left panel: next event and event list -->
        <div class="flex flex-col gap-4">
          <!-- Primary event card -->
          <div id="big-card" class="flex flex-col bg-slate-200 rounded-2xl p-6">
            <!-- big card content rendered from dash.js -->
          </div>

          <!-- Sub-events (slightly indented) -->
          <div id="dashboard-sub-events" class="flex flex-col gap-3 ml-8">
            <!-- sub-event cards rendered from dash.js -->
          </div>
        </div>
      </div>

      <div class="flex-1 min-w-0 p-4 mt-3.5 mr-4 mb-4 bg-slate-200 rounded-2xl">
        <!-- Right panel: friends who are available now -->
        <h3 class="text-4xl text-dark space-y-4 mb-4">
          Friends available now:
        </h3>
        <div id="friends-list" class="flex flex-col gap-3">
          <!-- Friend items will be rendered here by dash.js -->
        </div>
      </div>
    </div>

    <footer class="items-center text-center text-xl">
      <h3>That's all for today!</h3>
    </footer>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/dash.js') }}"></script>
{% endblock %}
