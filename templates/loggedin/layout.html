<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CASync</title>

    <!-- Roboto font css file; Sets all text to roboto-->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/font.css')}}"
    />

    <!-- Tailwind CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>

    <!-- Additional CSS goes here-->
    {% block head %}{% endblock %}
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="flex h-screen overflow-hidden">
      <!-- Left Sidebar Navigation: template code -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-64 bg-primary shadow-lg transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out flex flex-col"
      >
        <!-- Logo/Brand-->
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-gray-200"
        >
          <a
            href="{{ url_for('loggedin.dash') }}"
            class="flex items-center space-x-2"
          >
            <img
              src="{{url_for('static', filename='images/w-logo.png')}}"
              class="h-10 md:h-14 width-auto py-0.5 my-2"
              alt="logo"
            />
          </a>
          <!-- Close button for mobile -->
          <button
            id="sidebar-close"
            class="md:hidden text-nearwhite hover:text-dark"
          >
            <i class="fas fa-xmark text-xl"></i>
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
          <!-- Not Authed -->
          <!-- Authed -->
          <a
            href="{{ url_for('loggedin.dash') }}"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-primary-light hover:text-primary transition group {% if request.endpoint == 'loggedin.dash' %}bg-primary-light text-primary{% else %}text-nearwhite{% endif %}"
          >
            <i class="fas fa-solid fa-table-columns w-5 mr-3"></i>
            <span class="font-medium">Dashboard</span>
          </a>
          <a
            href="{{ url_for('loggedin.schedule') }}"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-primary-light hover:text-primary transition group {% if request.endpoint == 'loggedin.schedule' %}bg-primary-light text-primary{% else %}text-nearwhite{% endif %}"
          >
            <i class="fas fa-calendar-days w-5 mr-3"></i>
            <span class="font-medium">Schedule</span>
          </a>
          <a
            href="{{ url_for('loggedin.groups') }}"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-primary-light hover:text-primary transition group {% if request.endpoint == 'loggedin.groups' %}bg-primary-light text-primary{% else %}text-nearwhite{% endif %}"
          >
            <i class="fas fa-solid fa-people-group w-5 mr-3"></i>
            <span class="font-medium">Groups</span>
          </a>
          <a
            href="{{ url_for('loggedin.friends') }}"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-primary-light hover:text-primary transition group {% if request.endpoint == 'loggedin.friends' %}bg-primary-light text-primary {% else %}text-nearwhite{% endif %}"
          >
            <i class="fas fa-solid fa-user-group w-5 mr-3"></i>
            <span class="font-medium">Friends</span>
          </a>

          <!-- Settings and user -->
          <div class="pt-4 mt-4 border-t border-gray-200">
            <a
              href="{{ url_for('loggedin.settings') }}"
              class="flex items-center px-4 py-3 rounded-lg hover:bg-primary-light hover:text-primary transition group {% if request.endpoint == 'loggedin.settings' %}bg-primary-light text-primary{% else %}text-nearwhite{% endif %}"
            >
              <i class="fas fa-gear w-5 mr-3"></i>
              <span class="font-medium">Settings</span>
            </a>
          </div>
        </nav>

        <!-- Logout at bottom -->
        <div class="p-4 border-t border-gray-200">
          <a
            href="#"
            onclick="
              logoutImplementation();
              return false;
            "
            class="flex items-center px-4 py-3 text-nearwhite rounded-lg hover:bg-primary-light hover:text-red-600 transition group"
          >
            <i class="fas fa-right-from-bracket w-5 mr-3"></i>
            <span class="font-medium">Logout</span>
          </a>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top bar for mobile -->
        <header class="md:hidden bg-white shadow-sm z-40">
          <div class="flex items-center justify-between p-4">
            <button
              id="sidebar-open"
              class="text-gray-700 hover:text-blue-600 focus:outline-none"
            >
              <i class="fas fa-bars text-xl"></i>
            </button>
            <span class="text-lg font-bold text-gray-900">CASync</span>
            <div class="w-6"></div>
            <!-- Spacer for centering -->
          </div>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto bg-gray-50">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"
    ></div>

    <!-- JavaScript -->

    <!-- Sidebar Toggle Script -->
    <script>
      const sidebar = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebar-overlay");
      const sidebarOpen = document.getElementById("sidebar-open");
      const sidebarClose = document.getElementById("sidebar-close");

      sidebarOpen.addEventListener("click", function () {
        sidebar.classList.remove("-translate-x-full");
        sidebarOverlay.classList.remove("hidden");
      });

      function closeSidebar() {
        sidebar.classList.add("-translate-x-full");
        sidebarOverlay.classList.add("hidden");
      }

      sidebarClose.addEventListener("click", closeSidebar);
      sidebarOverlay.addEventListener("click", closeSidebar);

      function logoutImplementation() {
        window.location.href = "/dev/logout";
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
