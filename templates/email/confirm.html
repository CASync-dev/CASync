<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:20px;">Confirm your email</h1>
                <p style="margin:0 0 16px;line-height:1.5;">
                  Hi {{ user.username }}, thanks for signing up to CASync.
                  Please confirm your email address to activate your account.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ link }}"
                     style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;">
                    Confirm email
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:13px;color:#71717a;line-height:1.5;">
                  Or paste this link into your browser:<br />
                  <a href="{{ link }}" style="color:#4f46e5;">{{ link }}</a>
                </p>
                <p style="margin:16px 0 0;font-size:13px;color:#71717a;">
                  This link expires in 24 hours. If you didn't create an account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
