{% extends "loggedout/log-out-layout.html" %} {% block content %}
<!-- This page handles account deletion, in case the user accidentally somehow clicks wrong-->
<body>
    <div
    class="antialiased mx-auto bg-white flex max-w-2.5 items-center justify-center text-center">
        <div class="card-form">
            <h1 class="-m-1 text-2xl text-red-600 mx-auto font-medium text-center">
            Account Deletion
        </h1>
        <p>
            Are you sure you want to delete your account? All of your data will be deleted. 
            To cancel account deletion, leave this page at any time.
        </p>
        <button class = "cursor-pointer mt-3 inline-flex w-full justify-center rounded-md border border-red-800 bg-red-500 px-4 py-2 text-base font-medium text-white shadow-sm hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 sm:mt-0 sm:w-auto sm:text-sm"
            onclick = "">
            I understand the risks from deletion of my account, and wish to proceed.
        </button>
        </div>
</body>
{% endblock %}
