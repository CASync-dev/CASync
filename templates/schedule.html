{% extends "layout.html" %} {% block content %}
<!-- Main Calendar Section Container -->
<section class="relative bg-stone-50">
  <div class="w-full max-w-7xl mx-auto px-6 lg:px-8 overflow-x-auto">
    <!-- Calendar Header: Contains title, view selector, and new activity button -->
    <div
      class="flex flex-col md:flex-row max-md:gap-3 items-center justify-between"
    >
      <!-- Calendar Icon and Current Date Display -->
      <div class="flex items-center gap-4">
        <!-- Calendar Icon  -->
        <i class="fa-solid fa-calendar-days text-gray-400 text-2xl"></i>
        <!-- Current date will be dynamically updated by JavaScript -->
        <h6
          id="calendar-title"
          class="text-xl leading-8 font-semibold text-gray-900"
        >
          Today, January 2024
        </h6>
      </div>
      <!-- New Activity Button -->
      <button
        class="p-2 m-2 bg-indigo-600 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"
        id="new-event-btn"
        command="show-modal"
        commandfor="drawer"
      >
        <i class="fa-solid fa-plus text-sm"></i>
        New Activity
      </button>
    </div>

    <!-- Calendar Grid Container -->
    <div class="relative">
      <div class="flex justify-between p-2">
        <button

        >
          < last week
        </button>
        <button
          id="btn-today"
          class="hidden bg-emerald-500 p-2 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"

          today
        </button>
        <button
          id="btn-next-week"

          next week >

      </div>
      <!-- Week Header Row: Monday-Friday work week -->
      <div
        class="grid grid-cols-6 border-t border-gray-200 sticky top-0 left-0 w-full"
      >
        <!-- Empty corner cell for time column -->
        <div

        <!-- Day columns - dates and day names will be dynamically set by JavaScript -->

  <!-- Add Event Drawer-->
  <el-dialog>
    <dialog
      id="drawer"
      class="fixed inset-0 size-auto max-h-none max-w-none overflow-hidden bg-transparent not-open:hidden backdrop:bg-transparent"
    >
      <el-dialog-backdrop
        class="absolute inset-0 transition-opacity duration-500 ease-in-out data-closed:opacity-0"
      ></el-dialog-backdrop>

      <div
        tabindex="0"
        class="absolute inset-0 pl-10 focus:outline-none sm:pl-16"
      >
        <el-dialog-panel
          class="group/dialog-panel relative ml-auto block size-full max-w-md transform transition duration-500 ease-in-out data-closed:translate-x-full sm:duration-700"
        >
          <!-- Close button, show/hide based on slide-over state. -->
          <div
            class="absolute top-0 left-0 -ml-8 flex pt-4 pr-2 duration-500 ease-in-out group-data-closed/dialog-panel:opacity-0 sm:-ml-10 sm:pr-4"
          >
            <button
              type="button"
              command="close"
              commandfor="drawer"
              class="relative rounded-md text-gray-400 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
            >
              <span class="absolute -inset-2.5"></span>
              <span class="sr-only">Close panel</span>
              <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
          </div>

          <div
            class="relative flex h-full flex-col overflow-y-aut bg-white py-6 shadow-xl after:absolute after:inset-y-0 after:left-0 after:w-px after:bg-white/10"
          >
            <div class="px-4 sm:px-6">
              <h2
                id="drawer-title"
                class="text-base font-semibold border-b border-gray-700 pb-4"
              >
                Create New Event
              </h2>
            </div>
            <div class="relative mt-6  px-4 sm:px-6">
              <form>
                <div class="">
                  <div>
                    <label
                      for="event-title"
                      class="block text-sm font-medium"
                    >
                      Event Title
                    </label>
                    <input
                      type="text"
                      id="event-title"
                      name="event-title"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm  focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <div>
                    <label
                      for="event-date"
                      class="block text-sm font-medium"
                    >
                      Date & Time
                    </label>
                    <input
                      type="datetime-local"
                      id="event-date"
                      name="event-date"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <div>
                    <label
                      for="event-description"
                      class="block text-sm font-medium"
                    >
                      Description
                    </label>
                    <textarea
                      id="event-description"
                      name="event-description"
                      rows="3"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    ></textarea>
                  </div>
              </form>
            </div>
          </div>
        </el-dialog-panel>
      </div>
    </dialog>
  </el-dialog>
</section>
