<!-- This is template cal from https://pagedone.io/tailwind-blocks/application/calendar -->
{% extends "layout.html" %} {% block content %}
<!-- Main Calendar Section Container -->
<section class="relative bg-stone-50">
  <div class="w-full max-w-7xl mx-auto px-6 lg:px-8 overflow-x-auto">
    <!-- Calendar Header: Contains title, view selector, and new activity button -->
    <div
      class="flex flex-col md:flex-row max-md:gap-3 items-center justify-between"
    >
      <!-- Calendar Icon and Current Date Display -->
      <div class="flex items-center gap-4">
        <!-- Calendar Icon  -->
        <i class="fa-solid fa-calendar-days text-gray-400 text-2xl"></i>
        <!-- Current date will be dynamically updated by JavaScript -->
        <h6
          id="calendar-title"
          class="text-xl leading-8 font-semibold text-gray-900"
        >
          Today, January 2024
        </h6>
      </div>
      <!-- New Activity Button -->
      <button
        class="p-2 m-2 bg-indigo-600 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"
        id="new-event-btn"
        command="show-modal"
        commandfor="drawer"
      >
        <i class="fa-solid fa-plus text-sm"></i>
        New Activity
      </button>
    </div>

    <!-- Calendar Grid Container -->
    <div class="relative">
      <div class="flex justify-between p-2">
        <button
          id="btn-last-week"
          class="p-2 bg-indigo-600 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"
        >
          < last week
        </button>
        <button
          id="btn-today"
          class="hidden bg-emerald-500 p-2 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"
        >
          today
        </button>
        <button
          id="btn-next-week"
          class="p-2 bg-indigo-600 rounded-xl flex items-center gap-2 text-base font-semibold text-white transition-all duration-300 hover:bg-indigo-700"
        >
          next week >
        </button>
      </div>
      <!-- Week Header Row: Monday-Friday work week -->
      <div
        class="grid grid-cols-6 border-t border-gray-200 sticky top-0 left-0 w-full"
      >
        <!-- Empty corner cell for time column -->
        <div
          class="p-3.5 flex items-center justify-center text-sm font-medium text-gray-900"
        ></div>
        <!-- Day columns - dates and day names will be dynamically set by JavaScript -->
        <div
          id="date-col-0"
          class="p-3.5 flex items-center justify-center text-sm font-medium text-gray-900"
        >
          Mon
        </div>
        <div
          id="date-col-1"
          class="p-3.5 flex items-center justify-center text-sm font-medium text-gray-900"

  <!-- Add Event Drawer-->
  <el-dialog>
    <dialog
      id="drawer"
      class="fixed inset-0 size-auto max-h-none max-w-none overflow-hidden bg-transparent not-open:hidden backdrop:bg-transparent"
    >
      <el-dialog-backdrop
        class="absolute inset-0 transition-opacity duration-500 ease-in-out data-closed:opacity-0"
      ></el-dialog-backdrop>

      <div
        tabindex="0"
        class="absolute inset-0 pl-10 focus:outline-none sm:pl-16"
      >
        <el-dialog-panel
          class="group/dialog-panel relative ml-auto block size-full max-w-md transition duration-500 ease-in-out data-closed:translate-x-full sm:duration-700"
        >
          <!-- Close button, show/hide based on slide-over state. -->
          <div
            class="absolute -ml-8 flex pt-4 pr-2 duration-500 ease-in-out group-data-closed/dialog-panel:opacity-0 sm:pr-4"
          >
            <button
              type="button"
              command="close"
              commandfor="drawer"
              class="rounded-md text-gray-400 hover:text-black focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
            >
              <span class="absolute"></span>
              <span class="sr-only">Close panel</span>
              <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
          </div>

          <div
            class="relative flex h-full flex-col overflow-y-auto bg-gray-100 py-6 shadow-xl after:absolute"
          >
            <div class="px-4 sm:px-6">
              <h2
                id="drawer-title"
                class="text-base font-semibold border-b border-gray-700 pb-4"
              >
                Create New Event
              </h2>
            </div>
            <div class="relative mt-6 px-4 sm:px-6">
              <form id="add-event-form">
                <div class="">
                  <div class="mb-3">
                    <label for="event-title" class="block text-sm font-medium">
                      Event Title
                    </label>
                    <input
                      type="text"
                      id="event-title"
                      name="event-title"
                      class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="event-date" class="block text-sm font-medium">
                      Date
                    </label>
                    <input
                      type="date"
                      id="event-date"
                      name="event-date"
                      class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="event-time" class="block text-sm font-medium">
                      Time
                    </label>
                    <div class="flex">
                      <input
                        type="time"
                        id="event-time-start"
                        name="event-time-start"
                        class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                      />
                      <p class="mx-2">-</p>
                      <input
                        type="time"
                        id="event-time-end"
                        name="event-time-end"
                        class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label
                      for="event-location"
                      class="block text-sm font-medium"
                    >
                      Location
                    </label>
                    <input
                      type="text"
                      id="event-location"
                      name="event-location"
                      class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="event-description" class="text-sm font-medium">
                      Description
                    </label>
                    <textarea
                      id="event-description"
                      name="event-description"
                      rows="3"
                      class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    ></textarea>
                  </div>
                  <!-- TODO: Temporary user selection. will be based on session later -->
                  <div class="mb-3">
                    <label for="event-users" class="text-sm font-medium">
                      User ID
                    </label>
                    <input
                      type="text"
                      id="user-id"
                      name="user-id"
                      placeholder="1..."
                      class="mt-1 block w-full rounded-md bg-white border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    />
                  </div>
                  <!-- color picker - these colors are defined in schedule.js/COLOR_MAP -->
                  <div>
                    <label for="event-color" class="text-sm font-medium">
                      Event Color
                    </label>
                    <!-- hidden input to store the selected color -->
                    <input type="hidden" id="event-color" value="indigo" />
                    <div class="flex gap-1" id="color-picker-buttons">
                      <!-- indigo -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-indigo-500 border border-gray-300 shadow-sm sm:text-sm ring-2 ring-offset-2 ring-black"
                        onclick="selectColor(this, 'indigo')"
                      ></button>
                      <!-- red -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-red-500 border border-gray-300 shadow-sm sm:text-sm"
                        onclick="selectColor(this, 'red')"
                      ></button>
                      <!-- orange -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-orange-500 border border-gray-300 shadow-sm sm:text-sm"
                        onclick="selectColor(this, 'orange')"
                      ></button>
                      <!-- yellow -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-yellow-500 border border-gray-300 shadow-sm sm:text-sm"
                        onclick="selectColor(this, 'yellow')"
                      ></button>
                      <!-- green -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-green-500 border border-gray-300 shadow-sm sm:text-sm"
                        onclick="selectColor(this, 'green')"
                      ></button>
                      <!-- blue -->
                      <button
                        type="button"
                        class="mt-1 block w-16 h-8 rounded-md bg-blue-500 border border-gray-300 shadow-sm sm:text-sm"
                        onclick="selectColor(this, 'blue')"
                      ></button>
                    </div>
                  </div>
                  <!-- Form Messages -->
                  <div>
                    <p
                      id="form-message"
                      class="text-sm text-red-500 hidden"
                    ></p>
                  </div>
                  <!-- Submit Button -->
                  <div class="mt-6">
                    <button
                      type="submit"
                      class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"

                      Create Event
                    </button>
                    <button
                      type="button"
                      command="close"

                      class="ml-3 inline-flex justify-center rounded-md border border-gray-300 bg-white py-2 px-4 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                    >
                      Cancel

                  </div>
                </div>
              </form>
            </div>
          </div>
