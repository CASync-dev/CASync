<body>
    <div class="mx-auto">
        <h1 class = "flex items-center justify-center text-center text-6xl py-4 px-5"> Register </h1>
        <form>
            <legend> Log In</legend>
            <label for="user"> User: </label>
            <input type="text" id="user" name = "user"> <br>
            <label for="pw1"> Password: </label>
            <input type="password" id = "pw1" name = "pw1"> <br>
            <label for="pw2"> Reenter Password: </label>
            <input type="password" id = "pw2" name = "pw2"> <br>
            <input type = "checkbox" id = "rme" name = "rme">
            <label for="rme"> Remember me </label>
            <a href = "./dashboard.html" class = "button"> Log In </a>
        </form>
    </div>
</body>
