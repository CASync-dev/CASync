<!DOCTYPE html>
<head>
    <!-- TODO: Redesign, JS functionability-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <title>
        Log In - CasSync
    </title>
</head>
<header>
    <div class = "mx-auto">
        <h1 class = "flex items-center justify-center text-center text-4xl py-4 px-5"> CasSync </h1>
        <br>
        <br>
        <br>
    </div>
</header>
<body class="antialiased bg-fuchsia-50 dark:bg-fuchsia-900">
    <div class = "login">
        <form novalidate = "novalidate" method="post">
            <div>
                <label for = "user">Username:</label>
                <input id="user" type="text" autocomplete="username" aria-required="true" aria-invalid="false" autofocus = "autofocus" size="30" name="user">
                <label for = "pw">Password:</label>
                <input id="pw" type = "text" autocomplete="current-password" aria-required="true" aria-invalid="false" autofocus = "autofocus" size="30" name = "pw">
                <input type = "checkbox" id = "rme" name = "rme">
                <label for="rme"> Remember me </label>
                <a href = "./dashboard.html" class = "button"> Continue </a>
            </div>
        </form>
    </div>
</body>
</html>
