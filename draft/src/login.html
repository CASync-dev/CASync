<!DOCTYPE html>
<html>
<head>
    <!-- TODO: Redesign, JS functionability-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src = "login.js"> </script>


    <title>
        Log In - CasSync
    </title>
</head>
<header>
    <div class = "mx-auto bg-fuchsia-800">
        <br>
        <br>
        <br>
        <a href="./homepage.html"> 
        <h1 class = "flex items-center justify-center text-center text-4xl py-4 px-5"> Cas<strong>Sync</strong> </h1>
        </a>
        <br>
        <br>
        <br>
    </div>
</header>
<body class="antialiased mx-auto bg-fuchsia-700 items-center text-center">
    <div>
        <form name = "login" novalidate = "novalidate" onsubmit = "return loginImplementation()" method="post">
            <div>
                <label for = "user">Username:</label>
                <input id = "user" name="user" type="text" autocomplete="username" aria-required="true" 
                    aria-invalid="false" autofocus = "autofocus" size="30" name="user">
                <br>
                <br>
                <br>
                <label for = "pw">Password:</label>
                <input id="pw" name = "pw" type = "password" autocomplete="current-password" 
                    aria-required="true" aria-invalid="false" autofocus = "autofocus" size="30" name = "pw" required>
                <br>
                <input type = "checkbox" id = "rme" name = "rme">
                <label for="rme"> Remember me </label>
                <br>
                <br>
                <br>
                <input id = "log" type = "submit" class = "button" value = "Log In">
                
            </div>
        </form>
    </div>
</body>
</html>
